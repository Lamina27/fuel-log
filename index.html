<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuel Log</title>
<meta name="description" content="Pencatat kalori, olahraga, air, dan puasa. Bisa dipakai tanpa sinyal.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#EDF0EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fuel Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>body{margin:0}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: satu kolom mobile-first seperti buku neraca — masuk (makanan) vs keluar (tubuh + gerak), tab bawah tetap */
[hidden] { display: none !important; }
:root {
  --bg: #EDF0EB;
  --surface: #F9FAF7;
  --sunk: #E2E7E0;
  --ink: #18221D;
  --muted: #5B6861;
  --line: #C9D2CA;
  --food: #B35A0C;      /* energi masuk */
  --burn: #0B6E7F;      /* energi keluar */
  --burn2: #3E97A6;
  --burn3: #8CC3CC;
  --ok: #2F7A3E;
  --water: #2D6FB0;
  --sky1: #BFDCEA;
  --sky2: #EAF3EF;
  --cloud: #FFFFFF;
  --plane: #FBFCFA;
  --glass: #9CC3D5;
  --carb: #A8740E;
  --prot: #2F7A5A;
  --fat: #6E4A8E;
  --weight: #C2603A;
  --flame: #E8892B;
  --bad: #B3261E;
  --focus: #0B6E7F;
  --on-ink: #F9FAF7;
  --f-display: "Archivo", "Noto Sans JP", "Hiragino Sans", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Source Sans 3", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Noto Sans JP", monospace;
  --r: 8px;
  --r-s: 5px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111613; --surface: #19201C; --sunk: #0C100E; --ink: #E3EAE5; --muted: #98A69E; --line: #2C3732;
    --food: #F0A04B; --burn: #4FC0D2; --burn2: #2F8F9F; --burn3: #24616B; --ok: #6BC27E; --water: #6FA8E0; --sky1: #0E2230; --sky2: #1A2A2E; --cloud: #3A4C55; --plane: #DCE4DF; --glass: #4E7A8C; --flame: #F2A54A; --carb: #E0AE4E; --prot: #6CC59A; --fat: #B996D8; --weight: #F09A76; --bad: #F2766C;
    --focus: #4FC0D2; --on-ink: #111613; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111613; --surface: #19201C; --sunk: #0C100E; --ink: #E3EAE5; --muted: #98A69E; --line: #2C3732;
  --food: #F0A04B; --burn: #4FC0D2; --burn2: #2F8F9F; --burn3: #24616B; --ok: #6BC27E; --water: #6FA8E0; --sky1: #0E2230; --sky2: #1A2A2E; --cloud: #3A4C55; --plane: #DCE4DF; --glass: #4E7A8C; --flame: #F2A54A; --bad: #F2766C;
  --focus: #4FC0D2; --on-ink: #111613; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); font-stretch: 75%; font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: 0.01em; }
.n { font-family: var(--f-num); font-variant-numeric: tabular-nums; }

.wrap { max-width: 560px; margin: 0 auto; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }

/* ---------- kepala */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.brandrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font-family: var(--f-display); font-stretch: 70%; font-weight: 800; font-size: 24px; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1; }
.brand i { font-style: normal; color: var(--food); }
.brand em { font-style: normal; color: var(--burn); }
.sync { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.sync.cloud::before { background: var(--ok); }
.sync.local::before { background: var(--food); }
.sync.bad { color: var(--bad); }
.sync.bad::before { background: var(--bad); }
.datenav { display: flex; align-items: center; gap: 6px; }
.datenav input { flex: none; width: 150px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-s); padding: 6px 8px; font-family: var(--f-num); font-size: 14px; }
.datenav .lbl { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-s); width: 36px; height: 34px; cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.iconbtn:disabled { opacity: 0.4; cursor: default; }

/* ---------- tab bawah */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.tabs button { border: 0; background: none; cursor: pointer; padding: 6px 2px; border-radius: var(--r-s); display: grid; justify-items: center; gap: 2px; color: var(--muted); font-size: 12.5px; font-weight: 600; }
.tabs button svg { width: 22px; height: 22px; }
.tabs button[aria-current="page"] { color: var(--ink); background: var(--sunk); }

/* ---------- umum */
section.view { display: grid; gap: 18px; padding-top: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.card h2 { font-size: 19px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.head .tot { font-family: var(--f-num); font-size: 14px; font-weight: 600; white-space: nowrap; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }
.hint b { color: var(--ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-s); padding: 8px 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.food { background: var(--food); border-color: var(--food); color: #fff; }
.btn.burn { background: var(--burn); border-color: var(--burn); color: #fff; }
:root[data-theme="dark"] .btn.food, :root[data-theme="dark"] .btn.burn, :root[data-theme="dark"] .btn.water { color: #111613; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.food, :root:not([data-theme="light"]) .btn.burn, :root:not([data-theme="light"]) .btn.water { color: #111613; } }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn.block { width: 100%; }
.btn.small { padding: 4px 9px; font-size: 13px; }
label.btn { display: inline-flex; align-items: center; justify-content: center; }
.it-act { margin-top: 6px; }
label.btn[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
.note b { color: var(--ink); }
.card > .note + .note, label.f + .note { margin-top: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
label.f { display: grid; gap: 4px; font-size: 13px; color: var(--muted); min-width: 0; }
label.f input, label.f select, textarea, .inp {
  width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--bg);
  padding: 7px 9px; color: var(--ink); font-size: 15px;
}
textarea { resize: vertical; min-height: 74px; font-family: var(--f-body); }
input[type="number"] { font-family: var(--f-num); }
.note { border-left: 3px solid var(--food); background: var(--sunk); padding: 8px 10px; font-size: 13.5px; border-radius: 0 var(--r-s) var(--r-s) 0; }
.note.bad { border-color: var(--bad); }
.note.info { border-color: var(--burn); }
.empty { color: var(--muted); font-size: 14px; padding: 4px 0; }

/* ---------- hero neraca */
.hero { display: grid; gap: 14px; padding: 16px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.big { font-family: var(--f-display); font-stretch: 62%; font-weight: 800; font-size: clamp(64px, 20vw, 96px); line-height: 0.9; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.big small { font-family: var(--f-body); font-size: 16px; font-weight: 600; color: var(--muted); letter-spacing: 0; margin-left: 6px; }
.big.over { color: var(--bad); }
.sub { font-size: 14px; color: var(--muted); }
.sub b { color: var(--ink); }
.bars { display: grid; gap: 8px; position: relative; }
.bar { display: grid; grid-template-columns: 54px 1fr; gap: 8px; align-items: center; font-size: 12.5px; color: var(--muted); }
.track { position: relative; height: 22px; background: var(--sunk); border-radius: 3px; overflow: visible; }
.seg { position: absolute; top: 0; bottom: 0; }
.seg.base { background: var(--burn3); }
.seg.step { background: var(--burn2); }
.seg.ex { background: var(--burn); }
.seg.food { background: var(--food); }
.whisk { position: absolute; top: 50%; height: 2px; background: var(--ink); opacity: 0.55; }
.whisk::before, .whisk::after { content: ""; position: absolute; top: -5px; width: 2px; height: 12px; background: var(--ink); }
.whisk::before { left: 0; } .whisk::after { right: 0; }
.tmark { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.figs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; border-top: 1px solid var(--line); padding-top: 12px; }
.fig .k { font-size: 12px; color: var(--muted); }
.fig .v { font-family: var(--f-num); font-weight: 600; font-size: 17px; white-space: nowrap; }
.fig .v.in { color: var(--food); } .fig .v.out { color: var(--burn); }
.fig .v.neg { color: var(--ok); } .fig .v.pos { color: var(--bad); }

/* ---------- daftar item */
ul.items { list-style: none; margin: 0; padding: 0; display: grid; }
ul.items li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
ul.items li:first-child { border-top: 0; }
.it-name { font-weight: 600; overflow-wrap: anywhere; }
.it-meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.it-k { font-family: var(--f-num); font-weight: 600; text-align: right; white-space: nowrap; }
.it-k small { display: block; font-weight: 400; font-size: 11.5px; color: var(--muted); }
.del { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 18px; width: 30px; height: 30px; border-radius: 50%; }
.del:hover { background: var(--sunk); color: var(--bad); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0 6px; border-radius: 3px; border: 1px solid currentColor; color: var(--burn); vertical-align: 1px; }
.tag.warn { color: var(--food); }
.macros { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.macros b { font-family: var(--f-num); color: var(--ink); font-weight: 600; }
.inline { display: grid; grid-template-columns: minmax(0, 1fr) 120px; gap: 10px; align-items: center; }
.inline .inp { text-align: right; }

/* ---------- waktu makan, air, suplemen, puasa */
.meal { display: grid; gap: 4px; padding-top: 10px; border-top: 1px solid var(--line); }
.meal:first-of-type { border-top: 0; padding-top: 0; }
.mealhead { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
.mealhead h3 { font-size: 16px; font-stretch: 80%; }
.mealhead .n { font-size: 13.5px; font-weight: 600; color: var(--food); }
.meal ul.items li:first-child { border-top: 1px solid var(--line); }
.mealpick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.mealpick button { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-s); padding: 8px 4px; cursor: pointer; font-weight: 600; font-size: 13.5px; }
.mealpick button[aria-pressed="true"] { background: var(--food); border-color: var(--food); color: #fff; }
.glasses { display: flex; flex-wrap: wrap; gap: 6px; }
.glasses i { width: 22px; height: 30px; border: 1.5px solid var(--water); border-top-width: 0; border-radius: 0 0 5px 5px; background: transparent; }
.glasses i.on { background: var(--water); }
.glasses i.extra { border-style: dashed; }
.btn.water { background: var(--water); border-color: var(--water); color: #fff; }
.chip.supp.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.chip.supp.on .n { color: inherit; opacity: 0.85; }
.seg.ahead { background: repeating-linear-gradient(135deg, transparent 0 3px, color-mix(in srgb, var(--surface) 60%, transparent) 3px 6px); }
.sw-ahead { background: repeating-linear-gradient(135deg, var(--burn3) 0 2px, var(--surface) 2px 4px) !important; }
.nowmark { position: absolute; top: -6px; bottom: -6px; width: 2px; background: var(--ink); }
.nowmark span { position: absolute; top: -16px; left: 50%; transform: translateX(-50%); font-family: var(--f-num); font-size: 10.5px; color: var(--ink); white-space: nowrap; }
.bars { padding-top: 10px; }
.fastlive { display: grid; gap: 10px; }
.fastclock { font-family: var(--f-display); font-stretch: 70%; font-weight: 800; font-size: 34px; line-height: 1; }
.seg.fastbar { background: var(--ok); }
details.defs { border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; }

/* ---------- kendaraan */
.flightbox { display: grid; gap: 10px; }
svg.sky { width: 100%; height: auto; display: block; border-radius: 10px; }
.sky .clouds { fill: var(--cloud); }
.sky .clouds.far { opacity: 0.55; }
.sky .clouds.near { opacity: 0.9; }
.sky .clouds .loop { animation: drift var(--cloud-dur) linear infinite; }
.sky .clouds.far .loop { animation-duration: calc(var(--cloud-dur) * 1.8); }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-340px); } }
.sky .speedlines line { stroke: var(--cloud); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 16 12; animation: dash calc(var(--cloud-dur) / 8) linear infinite; opacity: 0.8; }
@keyframes dash { to { stroke-dashoffset: -56; } }
.sky .bob { animation: bob 4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.sky .contrail { stroke-width: 3; stroke-linecap: round; fill: none; }
.sky .v-body { fill: var(--plane); stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
.sky .v-line { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linejoin: round; }
.sky .v-win circle { fill: var(--ink); opacity: 0.75; }
.sky .v-dark { fill: var(--ink); }
.sky .v-door { fill: none; stroke: var(--ink); stroke-width: 1; opacity: 0.5; }
.sky .canopy { fill: var(--glass); stroke: var(--ink); stroke-width: 1.2; }
.sky .skid { fill: none; stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
.sky .rotordisc { fill: var(--ink); opacity: 0.12; }
.sky .mainrotor line { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.sky .mainrotor { animation: rotor 0.18s linear infinite; }
@keyframes rotor { 0% { transform: scaleX(1); } 50% { transform: scaleX(-1); } 100% { transform: scaleX(1); } }
.sky .tailrotor line { stroke: var(--ink); stroke-width: 2.4; stroke-linecap: round; }
.sky .tailrotor { animation: tailrotor 0.15s linear infinite; }
@keyframes tailrotor { to { transform: rotate(360deg); } }
.sky .flame { fill: var(--flame); opacity: 0.9; animation: flicker 0.12s ease-in-out infinite alternate; transform-origin: 72px 102px; }
@keyframes flicker { from { transform: scaleX(0.92); } to { transform: scaleX(1.05); } }
.sky .diamond { fill: var(--sky2); opacity: 0.85; }
.sky .fuel { fill: var(--food); opacity: 0.85; }
.sky .fuel.over { fill: var(--bad); }
.sky .fuel-surf { fill: none; stroke: var(--food); stroke-width: 2; animation: slosh 2.4s ease-in-out infinite; }
@keyframes slosh { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-8px); } }
.sky .drip { fill: var(--bad); animation: drip 1.4s ease-in infinite; }
@keyframes drip { from { transform: translateY(0); opacity: 1; } to { transform: translateY(40px); opacity: 0; } }
.sky .hud text { font-family: var(--f-num); font-size: 11px; fill: var(--ink); }
.sky .hud .hud-big { font-size: 16px; font-weight: 600; }
.sky .hud .hud-k { font-size: 9px; letter-spacing: 0.08em; fill: var(--muted); }
.sky .hud .hud-over { fill: var(--bad); }
.vpick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; }
.vpick button { border: 0; background: var(--bg); padding: 6px 4px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); }
.vpick button + button { border-left: 1px solid var(--line); }
.vpick button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.flightmsg { font-size: 13.5px; color: var(--muted); line-height: 1.45; }
.flightmsg b { color: var(--ink); }
.flightmsg .st { font-family: var(--f-num); font-size: 11.5px; letter-spacing: 0.06em; padding: 1px 6px; border-radius: 3px; margin-right: 4px; color: var(--on-ink); background: var(--ok); }
.flightbox.heavy .flightmsg .st { background: var(--food); }
.flightbox.over .flightmsg .st { background: var(--bad); }
@media (prefers-reduced-motion: reduce) {
  .sky .clouds .loop, .sky .speedlines line, .sky .bob, .sky .fuel-surf, .sky .drip, .sky .mainrotor, .sky .tailrotor, .sky .flame { animation: none; }
}

/* ---------- air, makro, ringkasan */
.wtank { position: relative; height: 26px; border: 1.5px solid var(--water); border-radius: 13px; overflow: hidden; background: var(--bg); }
.wtank i { position: absolute; inset: 0 auto 0 0; background: var(--water); opacity: 0.85; }
.wtank b { position: absolute; top: 4px; bottom: 4px; width: 0; border-left: 1px dashed var(--line); }
.wtank span { position: absolute; right: 10px; top: 3px; font-size: 13px; font-weight: 600; color: var(--ink); }
.wbtns { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 6px; }
.wbtn { border: 1px solid var(--water); background: var(--bg); border-radius: var(--r-s); padding: 7px 4px; cursor: pointer; display: grid; gap: 1px; justify-items: center; color: var(--ink); }
.wbtn b { color: var(--water); font-size: 14px; }
.wbtn span { font-size: 11.5px; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wbtn:hover { background: color-mix(in srgb, var(--water) 12%, var(--bg)); }
.mbars { display: grid; gap: 6px; border-top: 1px solid var(--line); padding-top: 10px; }
.mbar { display: grid; grid-template-columns: 74px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.mbar b { font-size: 12.5px; color: var(--ink); white-space: nowrap; }
.mtrack { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.mtrack i { display: block; height: 100%; border-radius: 4px; }
.mtrack i.mc { background: var(--carb); } .mtrack i.mp { background: var(--prot); } .mtrack i.mf { background: var(--fat); }

<script>
/* ===== Mesin hitung (fungsi murni, tanpa DOM) ===== */
/* MET: 2024 Adult Compendium of Physical Activities (Herrmann dkk., 2024); kode di komentar (dicek ke PDF resmi pacompendium.com).
   perKm: biaya bersih kkal/kg/km. Lari = ACSM (0,2 mL/kg/m × 5 kkal/L). Jalan = ACSM 0,5 (treadmill datar) dinaikkan ~30%:
   jalan di lapangan butuh ~30% energi lebih per km dibanding treadmill datar, terutama karena tanjakan (Schantz dkk., 2022).
   Karena itu bila tanjakan tercatat, jalan memakai 0,5 + komponen vertikal (tidak dihitung dua kali). Hiking = asumsi.
   elev: kkal/kg per meter naik dari komponen vertikal ACSM (lari 0,9, jalan 1,8 mL/kg/m).
   spk: langkah per km. Jalan 1.300 ≈ panjang langkah 0,77 m, di antara 1.220–1.260 langkah/km (jalan komuter, Schantz 2022,
   Tabel 6) dan ~1.480 (langkah 0,674 m, Murtagh dkk. dalam Schantz 2022, Tabel 14). Lari dan hiking = asumsi. */
const TYPES = {
  run:      { label: 'Lari',             met: 9.3, cardio: true,  perKm: 1.0,  elev: 0.0045, spk: 1000 }, // 12050 lari 6–6,3 mph (dipakai hanya tanpa jarak)
  walk:     { label: 'Jalan kaki',       met: 3.8, cardio: true,  perKm: 0.65, elev: 0.009,  spk: 1300 }, // 17190
  hike:     { label: 'Hiking',           met: 6.0, cardio: true,  perKm: 0.85, elev: 0.009,  spk: 1500 }, // 17080
  ride:     { label: 'Sepeda',           met: 7.0, cardio: true },  // 01014
  swim:     { label: 'Renang',           met: 5.8, cardio: true },  // 18240
  strength: { label: 'Angkat beban',     met: 3.5, cardio: false }, // 02054 beberapa latihan, 8–15 repetisi
  strength_hard: { label: 'Angkat beban berat', met: 6.0, cardio: false }, // 02050 power lifting / body building, vigorous
  hiit:     { label: 'HIIT / sirkuit',   met: 7.0, cardio: true },  // 02210 HIIT, moderate effort
  yoga:     { label: 'Yoga / mobilitas', met: 2.3, cardio: false }, // 02150
  sport:    { label: 'Olahraga lain',    met: 7.0, cardio: true },  // 15610 sepak bola santai
  other:    { label: 'Lainnya',          met: 4.0, cardio: false }, // asumsi
};
const KCAL_PER_KG_FAT = 7700;
const KCAL_PER_STEP_PER_KG = 0.0005; // = 0,65 kkal/kg/km ÷ 1.300 langkah/km
const MODEL_VERSION = 2;
const DEFAULTS = { pal: 1.4, baseSteps: 5000, corr: 1.0 };

const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const sum = a => a.reduce((s, x) => s + x, 0);

function bmrOf(p, w) {
  return 10 * w + 6.25 * num(p.height) - 5 * num(p.age) + (p.sex === 'f' ? -161 : 5);
}

/* Kalori bersih satu aktivitas (di atas pembakaran dasar), plus metode yang dipakai */
function actKcal(a, p, w, restMin) {
  const T = TYPES[a.type] || TYPES.other;
  const min = num(a.dur);
  const dist = num(a.dist), elev = num(a.elev), dev = num(a.kcal), hr = num(a.hr);
  if (T.perKm && dist > 0) {
    // jalan + tanjakan tercatat: dasar treadmill datar ACSM 0,5 + komponen vertikal (tambahan ~30% Schantz sebagian besar tanjakan)
    const perKm = a.type === 'walk' && elev > 0 ? 0.5 : T.perKm;
    const net = w * dist * perKm + w * elev * T.elev;
    return { net, method: 'jarak', why: `${perKm} kkal/kg/km` + (elev > 0 ? ' + tanjakan' : '') };
  }
  if (dev > 0) {
    const net = dev * (p.corr == null ? DEFAULTS.corr : num(p.corr)) - restMin * min;
    return { net: Math.max(0, net), method: 'perangkat', why: `${Math.round(dev)} kkal × ${p.corr == null ? DEFAULTS.corr : num(p.corr)} − istirahat` };
  }
  if (hr > 0 && T.cardio && min > 0) {
    const age = num(p.age);
    const perMin = p.sex === 'f'
      ? (-20.4022 + 0.4472 * hr - 0.1263 * w + 0.074 * age) / 4.184
      : (-55.0969 + 0.6309 * hr + 0.1988 * w + 0.2017 * age) / 4.184;
    const net = Math.max(0, perMin) * min - restMin * min;
    return { net: Math.max(0, net), method: 'detak jantung', why: `Keytel, HR ${Math.round(hr)}` };
  }
  if (min > 0) {
    const net = T.met * w * min / 60 - restMin * min;
    return { net: Math.max(0, net), method: 'MET', why: `MET ${T.met} × ${Math.round(min)} mnt` };
  }
  return { net: 0, method: 'kurang data', why: 'isi durasi atau jarak' };
}

function activitySteps(a) {
  const T = TYPES[a.type];
  if (!T || !T.spk || a.inSteps === false) return 0;
  if (num(a.steps) > 0) return num(a.steps);
  return num(a.dist) * T.spk;
}

/* Waktu makan. Kunci tetap; label berubah saat puasa ibadah (sahur/berbuka). */
const MEALS = ['pagi', 'siang', 'snack', 'malam'];
const MEAL_LABEL = { pagi: 'Sarapan', siang: 'Makan siang', snack: 'Snack', malam: 'Makan malam' };
const MEAL_LABEL_IBADAH = { pagi: 'Sahur', siang: 'Siang', snack: 'Camilan', malam: 'Berbuka & malam' };
function mealLabel(k, ibadah) { return (ibadah ? MEAL_LABEL_IBADAH : MEAL_LABEL)[k] || k; }
function inferMeal(ts) {
  const d = new Date(ts || Date.now());
  const h = d.getHours() + d.getMinutes() / 60;
  if (h < 10.5) return 'pagi';
  if (h < 15) return 'siang';
  if (h < 17.5) return 'snack';
  return 'malam';
}
function mealOf(f) { return MEALS.includes(f.meal) ? f.meal : inferMeal(f.t); }

/* Target minum harian (mL). EFSA (2010): asupan cukup air TOTAL 2,5 L/hari (laki-laki) dan 2,0 L/hari (perempuan);
   EFSA mengasumsikan makanan biasanya menyumbang ~20% air total (dikutip Eur J Nutr 2016, doi 10.1007/s00394-015-0943-9),
   jadi dari minuman ±80%: 2.000 mL (L) / 1.600 mL (P). */
function waterTarget(p) {
  if (p && num(p.water) > 0) return num(p.water);
  return p && p.sex === 'f' ? 1600 : 2000;
}

/* Batas aman untuk pemakaian tanpa pendamping medis.
   NHLBI Practical Guide (NIH Pub. 00-4084, 2000): diet turun berat 1.000–1.200 kkal/hari untuk sebagian besar
   perempuan dan 1.200–1.600 kkal/hari untuk laki-laki; diet < 800 kkal/hari tidak dipakai rutin (perlu pemantauan khusus).
   Aplikasi swa-pantau memakai batas yang lebih longgar: target tidak pernah di bawah 1.200 (P) / 1.500 (L).
   Usia < 18 tahun: hanya pemeliharaan (rumus Mifflin untuk dewasa; remaja masih tumbuh). */
const MIN_INTAKE = { f: 1200, m: 1500 };
function minIntake(p) { return p && p.sex === 'f' ? MIN_INTAKE.f : MIN_INTAKE.m; }
function isMinor(p) { return !!(p && num(p.age) && num(p.age) < 18); }
function goalOf(p) { return isMinor(p) ? 0 : Math.max(0, num(p && p.goal)); }

/* Ringkasan satu hari. frac = bagian hari yang sudah lewat (1 untuk hari lalu).
   Mengembalikan null bila profil belum lengkap. */
function calcDay(day, p, frac) {
  if (!p || !num(p.height) || !num(p.age) || !num(p.weight)) return null;
  const f01 = frac == null ? 1 : Math.min(1, Math.max(0, frac));
  const w = num(day.weight) || num(p.weight);
  const bmr = bmrOf(p, w);
  const pal = num(p.pal) || DEFAULTS.pal;
  const base = bmr * pal;
  const restMin = base / 1440;
  const acts = (day.acts || []).map(a => Object.assign({}, a, actKcal(a, p, w, restMin)));
  const rawSteps = num(day.steps && day.steps.count);
  const actSteps = sum(acts.map(activitySteps));
  const effSteps = Math.max(0, rawSteps - actSteps);
  const baseSteps = p.baseSteps == null ? DEFAULTS.baseSteps : num(p.baseSteps);
  const stepKcal = Math.max(0, effSteps - baseSteps) * KCAL_PER_STEP_PER_KG * w;
  const exKcal = sum(acts.map(a => a.net));
  const out = base + stepKcal + exKcal;            // perkiraan 24 jam
  const sofar = base * f01 + stepKcal + exKcal;    // sudah terbakar sampai saat ini
  const foods = day.foods || [];
  const supps = day.supps || [];
  const foodKcal = sum(foods.map(f => num(f.kcal)));
  const suppKcal = sum(supps.map(s => num(s.kcal)));
  const intake = foodKcal + suppKcal;
  const sigma = Math.sqrt(sum(foods.map(f => {
    const half = (num(f.hi) - num(f.lo)) / 2;
    return half > 0 ? half * half : 0;
  })));
  const byMeal = {};
  MEALS.forEach(k => { byMeal[k] = { kcal: 0, items: [] }; });
  foods.forEach(f => { const k = mealOf(f); byMeal[k].kcal += num(f.kcal); byMeal[k].items.push(f); });
  const goalReq = goalOf(p);                        // defisit yang dipilih (0 untuk usia < 18)
  const floor = minIntake(p);
  let target = out - goalReq;
  const floored = goalReq > 0 && target < floor;    // dibatasi batas aman
  if (floored) target = Math.min(out, floor);       // bila keluar < batas: pemeliharaan, tanpa defisit
  const goal = Math.max(0, out - target);           // defisit efektif
  return {
    w, bmr, pal, base, acts, rawSteps, actSteps, effSteps, baseSteps, stepKcal, exKcal, out, sofar, frac: f01,
    foodKcal, suppKcal, intake, sigma, target, left: target - intake, balance: intake - out, byMeal,
    goal, goalReq, floored, floor, minor: isMinor(p),
    protein: sum(foods.map(f => num(f.p))) + sum(supps.map(s => num(s.p))),
    carb: sum(foods.map(f => num(f.c))), fat: sum(foods.map(f => num(f.f))),
    sugar: sum(foods.map(f => num(f.sg))), fiber: sum(foods.map(f => num(f.fb))), sodium: sum(foods.map(f => num(f.na))),
    activeKcal: stepKcal + exKcal, workoutMin: sum((day.acts || []).map(a => num(a.dur))),
    hasActivity: (day.acts || []).length > 0 || rawSteps > 0,
    water: num(day.water), waterTarget: waterTarget(p),
    fastH: sum((day.fasts || []).map(x => Math.max(0, (num(x.end) - num(x.start)) / 36e5))),
    logged: foods.length > 0,
  };
}

/* Target makro harian (gram).
   Protein 1,6 g/kg: di atas ~1,62 g/kg/hari tidak ada tambahan massa bebas lemak dari latihan beban (Morton dkk., 2018),
   dibatasi 35% energi (batas atas AMDR, IOM 2005). Lemak 25% energi (AMDR 20–35%). Karbo = sisa energi. */
function macroTargets(p, kcal, w) {
  const W = num(w) || num(p.weight);
  const K = Math.max(0, num(kcal));
  const P = Math.min(1.6 * W, 0.35 * K / 4);
  const F = 0.25 * K / 9;
  const C = Math.max(0, (K - P * 4 - F * 9) / 4);
  return { p: Math.round(P), f: Math.round(F), c: Math.round(C) };
}
/* Persentase energi makro (4/4/9 kkal per gram) */
function macroPct(c, p, f) {
  const e = num(c) * 4 + num(p) * 4 + num(f) * 9;
  if (!e) return { c: 0, p: 0, f: 0 };
  return { c: num(c) * 4 / e * 100, p: num(p) * 4 / e * 100, f: num(f) * 9 / e * 100 };
}
/* Gabungan gizi untuk sekumpulan hari (rata-rata per hari tercatat) */
function nutrition(days, p) {
  const rows = days.map(d => ({ d, r: calcDay(d, p) })).filter(x => x.r && x.r.logged);
  const n = rows.length;
  const tot = k => sum(rows.map(x => num(x.r[k])));
  const byMeal = {};
  MEALS.forEach(k => { byMeal[k] = sum(rows.map(x => x.r.byMeal[k].kcal)); });
  return {
    n, rows,
    kcal: tot('intake'), c: tot('carb'), p: tot('protein'), f: tot('fat'),
    sugar: tot('sugar'), fiber: tot('fiber'), sodium: tot('sodium'), byMeal,
  };
}

/* Regresi linier berat vs hari; kemiringan kg/hari */
function weightTrend(points) {
  if (points.length < 2) return null;
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const mx = sum(xs) / xs.length, my = sum(ys) / ys.length;
  let sxx = 0, sxy = 0;
  for (let i = 0; i < xs.length; i++) { sxx += (xs[i] - mx) ** 2; sxy += (xs[i] - mx) * (ys[i] - my); }
  if (sxx === 0) return null;
  const slope = sxy / sxx;
  return { slope, intercept: my - slope * mx, span: Math.max(...xs) - Math.min(...xs) };
}

/* Ringkasan bulan + kalibrasi model terhadap tren berat nyata */
function calcMonth(days, p) {
  const rows = days.map(d => ({ date: d.date, day: d, r: calcDay(d, p) })).filter(x => x.r);
  const logged = rows.filter(x => x.r.logged);
  const avg = k => logged.length ? sum(logged.map(x => x.r[k])) / logged.length : 0;
  const weights = days.filter(d => num(d.weight) > 0)
    .map(d => ({ x: Math.round((Date.parse(d.date) - Date.parse(days[0].date)) / 864e5), y: num(d.weight) }));
  const trend = weightTrend(weights);
  const totalBalance = sum(logged.map(x => x.r.balance));
  let calib = null;
  if (logged.length >= 14 && trend && trend.span >= 14) {
    const obsOut = avg('intake') - trend.slope * KCAL_PER_KG_FAT;
    const modelOut = avg('out');
    calib = { obsOut, modelOut, ratio: obsOut / modelOut };
  }
  return {
    rows, loggedDays: logged.length,
    avgIntake: avg('intake'), avgOut: avg('out'), avgBalance: avg('balance'),
    totalBalance, predictedKg: totalBalance / KCAL_PER_KG_FAT,
    weights, trend, actualKg: trend ? trend.slope * trend.span : null, calib,
  };
}

/* Deteksi duplikat aktivitas */
function isDuplicate(a, existing) {
  return (existing || []).some(b => {
    if (b.type !== a.type) return false;
    const dd = Math.abs(num(b.dur) - num(a.dur)) <= 2;
    const da = num(a.dist), db = num(b.dist);
    const dist = (da === 0 && db === 0) || (da > 0 && db > 0 && Math.abs(da - db) / Math.max(da, db) < 0.03);
    return dd && dist;
  });
}

  def_vehicle: ["Tangki = target makan hari ini; persentase TANGKI = masuk ÷ target. Tangki cadangan = lemak tubuh: terpakai saat masuk di bawah kebutuhan 24 jam, terisi saat melebihinya (≈ 7,7 kkal per gram). Selama tangki tidak melewati 100%, kendaraan jelajah penuh. Makin berlebih, makin lambat dan rendah. Ketinggian yang turun meniru ketinggian optimum yang turun saat bobot naik; perlambatannya kiasan.", "Tank = today's eating target; TANK % = intake ÷ target. The reserve tank is body fat: it's drawn down when intake is below the 24-hour need and refilled when intake exceeds it (≈ 7.7 kcal per gram). While the tank stays at or below 100%, the vehicle cruises at full speed. The more you overfill, the slower and lower it flies. The lower altitude mimics how optimum altitude drops as weight rises; the slowdown is only a metaphor.", "タンク＝今日の摂取目標、タンク％＝摂取÷目標。予備タンクは体脂肪で、摂取が24時間の必要量を下回ると使われ、上回ると補充されます（1 gあたり約7.7 kcal）。タンクが100%以下なら全速で巡航し、超えるほど遅く低く飛びます。高度が下がるのは重量増で最適高度が下がる実機をまねたもので、減速は比喩です。"],

  advanced_hint: ["Biarkan nilai bawaan dulu. Setelah 2–3 minggu, panel “Model vs kenyataan” di Stats menunjukkan apakah model perlu dinaikkan atau diturunkan.", "Keep the defaults at first. After 2–3 weeks, the “Model vs reality” panel in Stats shows whether the model should go up or down.", "最初は標準値のままにしてください。2〜3週間後、統計の「モデルと実際」でモデルを上げるか下げるべきかが分かります。"],

  bmr_line: ["BMR kamu sekitar {bmr} {u}/hari, pembakaran dasar (×{pal}) sekitar {base} {u}/hari.", "Your BMR is about {bmr} {u}/day; base burn (×{pal}) is about {base} {u}/day.", "あなたのBMRは約{bmr} {u}／日、基礎消費（×{pal}）は約{base} {u}／日です。"],
  how_calc: ["Cara hitung", "How it's calculated", "計算方法"],
  hc_base: ["BMR Mifflin-St Jeor [1] dikali PAL dasar 1,4, batas bawah gaya hidup sedenter menurut FAO/WHO/UNU (PAL 1,40–1,69) [2]. Angka ini sudah mencakup energi untuk mencerna makanan dan aktivitas ringan sehari-hari.", "Mifflin-St Jeor BMR [1] × base PAL 1.4, the lower bound of a sedentary lifestyle per FAO/WHO/UNU (PAL 1.40–1.69) [2]. This already covers the energy for digesting food and light daily activity.", "Mifflin-St Jeor式のBMR [1] × 基礎PAL 1.4。FAO/WHO/UNUによる座りがちな生活の下限（PAL 1.40〜1.69）[2]。食事の消化と軽い日常活動のエネルギーを含みます。"],
  bmr_formula: ["BMR = 10·berat + 6,25·tinggi − 5·umur + 5 (L) / −161 (P)", "BMR = 10·weight + 6.25·height − 5·age + 5 (M) / −161 (F)", "BMR = 10×体重 + 6.25×身長 − 5×年齢 + 5（男）／ −161（女）"],
  hc_dist_t: ["Lari, jalan, hiking dengan jarak", "Runs, walks, hikes with distance", "距離のあるラン・ウォーク・ハイク"],
  hc_dist: ["Persamaan ACSM [3]: komponen horizontal lari 0,2 mL O₂/kg/m ≈ 1,0 kkal/kg/km bersih (5 kkal per liter O₂), komponen vertikal 0,9 (lari) dan 1,8 (jalan) mL/kg per meter naik. Jalan 0,65 kkal/kg/km: ACSM 0,5 untuk treadmill datar, dinaikkan karena jalan di lapangan butuh ~30% energi lebih per km, terutama karena tanjakan [4]. Bila tanjakan tercatat, jalan memakai 0,5 ditambah komponen vertikal supaya tidak dihitung dua kali. Hiking 0,85 adalah asumsi untuk medan tidak rata.", "ACSM equations [3]: the horizontal running term 0.2 mL O₂/kg/m ≈ 1.0 net kcal/kg/km (5 kcal per litre of O₂); vertical terms 0.9 (run) and 1.8 (walk) mL/kg per metre climbed. Walking 0.65 kcal/kg/km: ACSM's 0.5 is for level treadmills, raised because walking in the field takes about 30% more energy per km, mainly because of slopes [4]. When elevation is recorded, walking uses 0.5 plus the vertical term so climbs aren't counted twice. Hiking 0.85 is an assumption for uneven terrain.", "ACSM式 [3]：ランの水平成分 0.2 mL O₂/kg/m ≈ 正味1.0 kcal/kg/km（O₂ 1 Lあたり5 kcal）、垂直成分はラン0.9・ウォーク1.8 mL/kg（1 m上昇あたり）。ウォーク0.65 kcal/kg/km：ACSMの0.5は平坦なトレッドミル用で、屋外歩行は主に坂のため1 kmあたり約30%多くのエネルギーを要する [4] ことから上方修正。標高差が記録されている場合は二重計算を避けるため、0.5に垂直成分を加えます。ハイク0.85は不整地の仮定値です。"],
  hc_other_t: ["Olahraga lain", "Other exercise", "その他の運動"],
  hc_other: ["Urutan: kalori dari aplikasi × faktor koreksi, lalu persamaan detak jantung Keytel [5] (dirancang untuk latihan submaksimal stabil, usia 18–45), lalu MET dari Compendium 2024 [6]. Semua dikurangi pembakaran dasar selama durasi itu supaya tidak terhitung dua kali.", "Order: app calories × correction factor, then the Keytel heart-rate equation [5] (designed for steady submaximal exercise, ages 18–45), then METs from the 2024 Compendium [6]. Base burn during that time is subtracted so nothing is counted twice.", "優先順：アプリのカロリー×補正係数 → Keytelの心拍式 [5]（一定強度の最大下運動、18〜45歳向け）→ 2024年版コンペンディウムのMET [6]。二重計上を避けるため、その時間の基礎消費を差し引きます。"],
  hc_corr_t: ["Faktor koreksi aplikasi = 1,0", "App correction factor = 1.0", "アプリ補正係数 = 1.0"],
  hc_corr: ["Meta-analisis 2020 menemukan perangkat yang dipakai di pergelangan tangan dan lengan secara keseluruhan sedikit <i>meremehkan</i> pengeluaran energi, tetapi akurasinya sangat bervariasi menurut jenis aktivitas; beberapa perangkat justru melebihkan saat berjalan atau naik tangga [7]. Karena arah kesalahannya tidak konsisten, bawaannya tidak dikoreksi.", "A 2020 meta-analysis found wrist- and arm-worn devices slightly <i>under</i>estimated energy expenditure overall, but accuracy varied a lot by activity type, and some devices overestimated during walking or stairs [7]. Because the direction isn't consistent, the default applies no correction.", "2020年のメタ分析では、手首・腕に装着するデバイスは全体としてエネルギー消費をやや<i>過小</i>評価しましたが、精度は活動の種類によって大きく異なり、歩行や階段では過大評価するデバイスもありました [7]。誤差の方向が一定しないため、標準では補正しません。"],
  hc_steps: ["0,0005 kkal/kg/langkah, setara 0,65 kkal/kg/km pada 1.300 langkah/km. Angka 1.300 berada di antara 1.220–1.260 langkah/km pada jalan komuter dan ~1.480 pada langkah yang lebih pendek [4]. 5.000 langkah pertama dianggap sudah ada di PAL dasar, karena di bawah angka itu termasuk sedenter [8]. Langkah dari lari/jalan yang sudah tercatat dikurangkan.", "0.0005 kcal/kg/step, equal to 0.65 kcal/kg/km at 1,300 steps/km. That's between 1,220–1,260 steps/km measured in commuter walking and ~1,480 at shorter step lengths [4]. The first 5,000 steps count as part of the base PAL, since below that is classed as sedentary [8]. Steps from logged runs/walks are subtracted.", "0.0005 kcal/kg/歩（1,300歩/kmで0.65 kcal/kg/kmに相当）。1,300は通勤歩行で測定された1,220〜1,260歩/kmと、歩幅が短い場合の約1,480歩/kmの間の値です [4]。5,000歩未満は座りがちと分類されるため [8]、最初の5,000歩は基礎PALに含めます。記録済みのラン・ウォークの歩数は差し引きます。"],
  hc_food: ["Perkiraan AI per item, merujuk TKPI [9] dan USDA FoodData Central. Studi pada ChatGPT-4 dengan foto makanan menemukan total energinya tepat rata-rata, tetapi berat porsi sedang dan besar diremehkan sekitar 27% dan 34% [10]. Model lain, termasuk Claude, bisa berbeda, jadi rentangnya ditampilkan. Rentang harian digabung dengan akar jumlah kuadrat karena kesalahan tiap item saling lepas.", "AI estimate per item, referencing the Indonesian Food Composition Table [9] and USDA FoodData Central. A study of ChatGPT-4 on meal photos found total energy accurate on average, but medium and large portion weights were underestimated by about 27% and 34% [10]. Other models, including Claude, may differ, so a range is shown. Daily ranges combine by root-sum-square because item errors are independent.", "品目ごとのAI推定。インドネシア食品成分表 [9] とUSDA FoodData Centralを参照。ChatGPT-4を料理写真で評価した研究では、エネルギーは平均的には正確でしたが、中盛り・大盛りの重量をそれぞれ約27%・34%過小評価しました [10]。Claudeを含む他のモデルでは結果が異なる可能性があるため、幅を表示します。各品目の誤差は独立なので、1日の幅は二乗和平方根で合成します。"],
  hc_macro_t: ["Target makro", "Macro targets", "PFC目標"],
  hc_macro: ["Protein 1,6 g per kg berat, karena di atas ~1,62 g/kg/hari tidak ada tambahan massa otot dari latihan beban [12]; dibatasi maksimal 35% energi. Lemak 25% energi. Keduanya di dalam rentang AMDR (protein 10–35%, lemak 20–35%, karbo 45–65%) [13]. Karbo mengisi sisa energi, jadi bisa sedikit di bawah 45% saat protein tinggi.", "Protein 1.6 g per kg body weight, since above ~1.62 g/kg/day resistance training adds no further muscle mass [12]; capped at 35% of energy. Fat 25% of energy. Both sit within the AMDR (protein 10–35%, fat 20–35%, carbs 45–65%) [13]. Carbs fill the remaining energy, so they can dip slightly below 45% when protein is high.", "たんぱく質は体重1 kgあたり1.6 g。約1.62 g/kg/日を超えても筋トレによる筋量増加は増えないため [12]。上限はエネルギーの35%。脂質はエネルギーの25%。いずれもAMDR（たんぱく質10〜35%、脂質20〜35%、炭水化物45〜65%）の範囲内です [13]。炭水化物は残りのエネルギーで、たんぱく質が多いと45%をやや下回ることがあります。"],
  hc_calib_t: ["Kalibrasi", "Calibration", "キャリブレーション"],
  hc_calib: ["1 kg ≈ 7.700 kkal (aturan 3.500 kkal per pon). Hall [11] menunjukkan angka ini cocok untuk orang dengan lemak tubuh di atas ~30 kg, tetapi berlebihan untuk orang yang lebih ramping. Berat harian juga naik-turun karena air dan isi pencernaan, jadi kalibrasi baru muncul setelah rentang timbang 14 hari.", "1 kg ≈ 7,700 kcal (the 3,500 kcal per pound rule). Hall [11] showed this fits people with more than ~30 kg of body fat but overestimates for leaner people. Daily weight also moves with water and gut contents, so calibration only appears after a 14-day weigh-in span.", "1 kg ≈ 7,700 kcal（1ポンドあたり3,500 kcalの経験則）。Hall [11] は、この値が体脂肪約30 kg超の人には合うものの、より痩せた人には過大であることを示しました。日々の体重は水分や消化管の内容物でも変動するため、体重測定が14日以上にわたってからキャリブレーションを表示します。"],
  hc_water_t: ["Target minum", "Water target", "飲水目標"],
  hc_water: ["2.000 mL (laki-laki) / 1.600 mL (perempuan) per hari dari minuman. EFSA menetapkan asupan cukup air total 2,5 L dan 2,0 L per hari, dan makanan biasanya menyumbang ~20% dari air total [16]. Cuaca panas dan olahraga menambah kebutuhan. Bisa diubah di Pengaturan lanjutan.", "2,000 mL (men) / 1,600 mL (women) a day from drinks. EFSA sets adequate total water intake at 2.5 L and 2.0 L a day, and food usually supplies about 20% of total water [16]. Hot weather and exercise raise the need. You can change it under Advanced settings.", "飲み物から1日2,000 mL（男性）/ 1,600 mL（女性）。EFSAは総水分の目安量を1日2.5 L・2.0 Lとし、通常その約20%は食べ物から摂取されるとしています [16]。暑い日や運動時は必要量が増えます。詳細設定で変更できます。"],
  references: ["Referensi", "References", "参考文献"],
  validation: ["Validasi", "Validation", "検証"],
  ref_acsm: ["persamaan metabolik jalan dan lari", "walking and running metabolic equations", "歩行・走行の代謝式"],
  storage: ["Penyimpanan", "Storage", "保存先"],
  storage_cloud: ["Catatanmu tersimpan di akun Claude-mu dan hanya bisa dibaca olehmu, termasuk bukan oleh pemilik aplikasi. Buka dari HP atau laptop, datanya sama.", "Your entries are saved to your Claude account and only you can read them, not even the app owner. Open it on phone or laptop and the data is the same.", "記録はあなたのClaudeアカウントに保存され、アプリの所有者を含め、あなた以外は読めません。スマホでもPCでも同じデータが表示されます。"],

const fi = n => Math.round(Number(n) || 0).toLocaleString(LOC());

/* ---------- penyimpanan: akun (db) atau perangkat (localStorage) */
const LS = {
  get(k) { try { const v = localStorage.getItem('nk:' + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('nk:' + k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const queues = new Map();
function enqueue(key, fn) {
  const prev = queues.get(key) || Promise.resolve();
  const next = prev.catch(() => {}).then(fn);
  queues.set(key, next);
  return next;
}
const col = () => S.db.collection('data/users/' + S.uid);
// db: data() dikirim beku (Object.freeze) — salin dulu supaya bisa diubah
const thaw = v => v == null ? v : JSON.parse(JSON.stringify(v));
const dayKey = d => 'd' + d;

async function loadDoc(id) {
  if (S.mode === 'cloud') {
    try { const s = await col().doc(id).get(); return s.exists ? thaw(s.data()) : null; }
    catch (e) {
      if (e && e.code === 'unavailable') {
        await new Promise(r => setTimeout(r, 400 + Math.random() * 600));
        const s = await col().doc(id).get(); return s.exists ? thaw(s.data()) : null;
      }
      throw e;
    }
  }
  return LS.get(id);
}
/* Tulis ke akun. Kontrak db: satu tulis per dokumen sekaligus (enqueue), 'unavailable' dicoba ulang
   sekali, kode tak dikenal = 'unavailable'. Gagal karena jaringan → antre di perangkat (outbox) dan
   dikirim otomatis saat online, supaya catatan tidak hilang di sinyal buruk. */
const pending = new Map();                       // id → jumlah tulis lokal yang belum selesai
const busy = id => (pending.get(id) || 0) > 0;
const NOWRITE = ['invalid_argument', 'not_granted', 'revoked', 'capability_disabled', 'capability_removed'];
const outbox = () => LS.get('outbox') || {};
function outboxPut(id, body) { const o = outbox(); o[id] = body; LS.set('outbox', o); }
function outboxDel(id) { const o = outbox(); if (id in o) { delete o[id]; LS.set('outbox', o); } }
const outboxCount = () => Object.keys(outbox()).length;
async function writeOnce(id, body) {
  try { await col().doc(id).set(body); }
  catch (e) {
    const code = e && e.code;
    if (code === 'unavailable' || code === 'resource_exhausted' || !code || ![...NOWRITE, 'quota_exceeded', 'transform_error'].includes(code)) {
      await new Promise(r => setTimeout(r, 500 + Math.random() * 800));
      await col().doc(id).set(body); return;
    }
    throw e;
  }
}
async function saveDoc(id, data) {
  const body = thaw(data);                       // JSON bersih: tanpa undefined/NaN, tidak berbagi objek
  if (S.mode === 'cloud') {
    pending.set(id, (pending.get(id) || 0) + 1);
    try { await enqueue(id, () => writeOnce(id, body)); outboxDel(id); if (!outboxCount()) renderSync(); return true; }
    catch (e) {
      const code = e && e.code;
      if (NOWRITE.includes(code) && !S.isOwner) { goLocal('nowrite'); }
      else if (code === 'quota_exceeded') { toast(t('err_quota')); return false; }
      else if (code === 'invalid_argument' || code === 'transform_error') { toast(t('err_save')); return false; }
      else {
        outboxPut(id, body); renderSync();
        // ditunda supaya tidak tertimpa toast "ditambahkan" dari aksi yang sama
        if (!S.offlineWarned) { S.offlineWarned = true; setTimeout(() => toast(t('toast_queued')), 2600); }
        scheduleFlush(); return true;
      }
    } finally { pending.set(id, pending.get(id) - 1); }
  }
  if (!LS.set(id, body)) {
    if (!S.lsFailed) { S.lsFailed = true; renderSync(); setTimeout(() => toast(t('err_local_save')), 2600); }
    return false;
  }
  if (S.lsFailed) { S.lsFailed = false; renderSync(); }
  return true;
}
// Ketukan beruntun (air) digabung jadi satu tulis per hari; selama menunggu, dokumen dianggap sibuk.
const dayTimers = new Map();
function queueDaySave(day, ms = 700) {
  const date = day.date, k = dayKey(date);
  if (dayTimers.has(k)) clearTimeout(dayTimers.get(k).h);
  else pending.set(k, (pending.get(k) || 0) + 1);
  const run = () => { dayTimers.delete(k); saveDay(S.days.get(date) || day).finally(() => pending.set(k, pending.get(k) - 1)); };
  dayTimers.set(k, { h: setTimeout(run, ms), run });
}
function flushDayTimers() { [...dayTimers.values()].forEach(x => { clearTimeout(x.h); x.run(); }); }
let flushTimer = null, flushing = false;
function scheduleFlush(ms = 30000) { clearTimeout(flushTimer); flushTimer = setTimeout(flushOutbox, ms); }
async function flushOutbox() {
  if (flushing || S.mode !== 'cloud') return;
  const ids = Object.keys(outbox()); if (!ids.length) return;
  flushing = true;
  try {
    for (const id of ids) {
      const body = outbox()[id]; if (!body) continue;
      pending.set(id, (pending.get(id) || 0) + 1);
      try { await enqueue(id, () => col().doc(id).set(body)); outboxDel(id); }
      catch (e) {
        // isi dokumen tidak valid tidak akan pernah berhasil → buang; selain itu simpan dan coba lagi nanti
        if ((e && e.code) === 'invalid_argument' && S.isOwner) outboxDel(id);
        else { scheduleFlush(); break; }
      }
      finally { pending.set(id, pending.get(id) - 1); }
    }
  } finally { flushing = false; renderSync(); }
  if (!outboxCount() && S.offlineWarned) { S.offlineWarned = false; toast(t('toast_synced')); }
}
// Terapkan antrean yang belum terkirim ke data yang baru dimuat (dipanggil saat mulai).
function applyOutbox() {
  const o = outbox();
  Object.entries(o).forEach(([id, body]) => {
    if (id === 'profile') S.profile = body;
    else if (id === 'state') S.state = Object.assign({ kind: 'state', fast: null, supps: [], containers: null, lang: null }, body);
    else if (id === 'lib') S.lib = body.items || [];
    else if (/^d\d{4}-\d{2}-\d{2}$/.test(id)) S.days.set(id.slice(1), Object.assign(blankDay(id.slice(1)), body));
  });
  return Object.keys(o).length;
}

/* Sinkron langsung antar-perangkat: dengarkan profil, pengaturan, makanan sering, dan hari yang dibuka.
   Satu langganan per dokumen; hari dipindah hanya saat tanggal berganti. */
const subs = new Map();
function watchDoc(id, apply) {
  if (S.mode !== 'cloud' || subs.has(id)) return;
  try {
    const un = col().doc(id).onSnapshot(s => {
      if (S.mode !== 'cloud' || !s || !s.exists) return;
      if ((s.metadata && s.metadata.hasPendingWrites) || busy(id) || (id in outbox())) return;
      apply(thaw(s.data()));
    }, () => { subs.delete(id); });
    subs.set(id, un);
  } catch (e) { /* tanpa langganan: tetap jalan seperti biasa */ }
}
function unwatchDoc(id) { const un = subs.get(id); if (un) { try { un(); } catch (e) {} subs.delete(id); } }
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
let watchedDay = null;
function syncWatch() {
  if (S.mode !== 'cloud') return;
  watchDoc('profile', d => { if (same(d, S.profile)) return; S.profile = d; S.months.clear(); S.ranges.clear(); liveRender(); });
  watchDoc('state', d => {
    const st = Object.assign({ kind: 'state', fast: null, supps: [], containers: null, lang: null }, d);
    if (same(st, S.state)) return;
    S.state = st;
    if (st.lang && LANGS[st.lang] && st.lang !== LANG) { LANG = st.lang; LS.set('lang', LANG); renderHeader(); }
    liveRender();
  });
  watchDoc('lib', d => { const items = d.items || []; if (!same(items, S.lib)) { S.lib = items; if (S.view === 'log') liveRender(); } });
  const key = dayKey(S.date);
  if (watchedDay !== key) {
    if (watchedDay) unwatchDoc(watchedDay);
    watchedDay = key;
    const date = S.date;
    watchDoc(key, d => {
      const nd = Object.assign(blankDay(date), d);
      if (same(nd, S.days.get(date))) return;
      S.days.set(date, nd); S.months.delete(ymOf(date)); S.ranges.clear(); liveRender();
    });
  }
}
// Gambar ulang setelah perubahan dari perangkat lain — tapi jangan ganggu orang yang sedang mengetik.
function liveRender() {
  const a = document.activeElement;
  const typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.closest('main');
  if (typing || S.view === 'log' || S.view === 'prof') { S.liveStale = true; return; }
  S.liveStale = false; render();
}
function goLocal(why) {
  if (S.mode === 'local') return;
  S.mode = 'local'; S.localWhy = why;
  if (why === 'nowrite') LS.set('mode', 'local');
  if (S.profile) LS.set('profile', S.profile);
  LS.set('lib', { kind: 'lib', items: S.lib });
  LS.set('state', S.state);
  S.days.forEach((d, k) => LS.set(dayKey(k), d));
  renderSync();
  toast(t('toast_local'));
}
function blankDay(date) { return { kind: 'day', date, foods: [], acts: [], steps: null, weight: null, water: 0, supps: [], fasts: [], ibadah: false }; }
async function getDay(date) {
  if (S.days.has(date)) return S.days.get(date);
  let d = null;
  try { d = await loadDoc(dayKey(date)); } catch (e) { d = null; }
  d = Object.assign(blankDay(date), d || {});
  S.days.set(date, d);
  return d;
}
async function saveDay(day) {
  S.days.set(day.date, day);
  S.months.delete(ymOf(day.date));
  S.ranges.clear();
  return saveDoc(dayKey(day.date), day);
}
async function getRange(from, to) {
  if (S.mode === 'cloud') {
    try {
      const snap = await col().where('kind', '==', 'day').where('date', '>=', from).where('date', '<=', to).limit(400).get();
      const map = new Map();
      snap.docs.forEach(s => { const d = Object.assign(blankDay(s.id.slice(1)), thaw(s.data())); map.set(d.date, d); });
      S.days.forEach((d, k) => { if (k >= from && k <= to) map.set(k, d); });
      map.forEach((d, k) => { if (!S.days.has(k)) S.days.set(k, d); });
      return [...map.values()];
    } catch (e) { /* jatuh ke cache */ }
  }
  const out = [];
  for (let d = from; d <= to; d = addDays(d, 1)) {
    const v = S.days.get(d) || (S.mode === 'local' ? LS.get(dayKey(d)) : null);
    if (v) out.push(Object.assign(blankDay(d), v));
  }
  return out;
}
async function saveState() { return saveDoc('state', S.state); }
async function saveLib() { return saveDoc('lib', { kind: 'lib', items: S.lib.slice(0, 80) }); }
function remember(foods) {
  foods.forEach(f => {
    const key = f.name.trim().toLowerCase();
    if (!key) return;
    const ex = S.lib.find(x => x.name.trim().toLowerCase() === key && (x.portion || '') === (f.portion || ''));
    if (ex) { Object.assign(ex, { kcal: f.kcal, lo: f.lo, hi: f.hi, p: f.p, c: f.c, f: f.f, sg: f.sg, fb: f.fb, na: f.na }); ex.n = (ex.n || 0) + 1; ex.last = Date.now(); }
    else S.lib.push({ name: f.name, portion: f.portion || '', kcal: f.kcal, lo: f.lo, hi: f.hi, p: f.p, c: f.c, f: f.f, sg: f.sg, fb: f.fb, na: f.na, n: 1, last: Date.now() });
  });
  S.lib.sort((a, b) => (b.n - a.n) || (b.last - a.last));
  S.lib = S.lib.slice(0, 80);
  saveLib();
}
async function setLang(l) {
  if (!LANGS[l]) return;

/* ---------- toast */
let toastTimer = null;
function toast(msg, action) {
  const el = $('#toast');
  el.innerHTML = '';
  const span = document.createElement('span'); span.textContent = msg; el.appendChild(span);
  if (action) {
    const b = document.createElement('button'); b.textContent = action.label || t('undo');
    b.onclick = () => { el.hidden = true; action.fn(); }; el.appendChild(b);
  }
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? 6000 : 3800);
}

const TYPE_KEYS = Object.keys(TYPES);
function cleanFood(it) {
  const kcal = Math.max(0, n0(it.kcal));
  let lo = n0(it.kcal_low), hi = n0(it.kcal_high);
  if (!(lo > 0) || lo > kcal) lo = Math.round(kcal * 0.8);
  if (!(hi > 0) || hi < kcal) hi = Math.round(kcal * 1.25);
  return {
    id: uid(), on: true, name: String(it.name || t('food_default')).slice(0, 80), portion: String(it.portion || '').slice(0, 60),
    grams: n0(it.grams) || null, kcal: Math.round(kcal), lo: Math.round(lo), hi: Math.round(hi),
    p: Math.round(n0(it.protein_g) * 10) / 10, c: Math.round(n0(it.carb_g) * 10) / 10, f: Math.round(n0(it.fat_g) * 10) / 10,
    sg: Math.round(n0(it.sugar_g) * 10) / 10, fb: Math.round(n0(it.fiber_g) * 10) / 10, na: Math.round(n0(it.sodium_mg)),
  };
}
function cleanAct(a) {
  const type = TYPE_KEYS.includes(a.type) ? a.type : 'other';
  const date = /^\d{4}-\d{2}-\d{2}$/.test(a.date || '') && a.date <= today() ? a.date : S.date;

}

async function runFoodAI() {
  const text = ($('#food-text') || {}).value || '';
  if (!text.trim() && !S.foodImgs.length) { toast(t('toast_food_need')); return; }
  const ctl = new AbortController();
  S.foodBusy = ctl; S.foodErr = ''; renderLog();
  try {
    const opts = { signal: ctl.signal };
    if (S.foodImgs.length) opts.images = S.foodImgs.map(x => x.file);
    const res = await S.sample.json(foodPrompt(text.trim(), S.foodImgs.length), opts);
    const items = Array.isArray(res && res.items) ? res.items.map(cleanFood).filter(x => x.kcal > 0) : [];
    if (!items.length) throw { code: 'empty_completion' };
    S.foodDraft = items; S.foodNote = String((res && res.note) || '').slice(0, 300);
  } catch (e) {
    S.foodErr = aiErr(e);
  } finally {
    S.foodBusy = null; renderLog();
  }
}

async function runShotAI() {
  if (!S.shotImgs.length) return;
  const ctl = new AbortController();
  S.shotBusy = ctl; S.shotErr = ''; renderLog();
  try {
    const res = await S.sample.json(shotPrompt(S.shotImgs.length), { signal: ctl.signal, images: S.shotImgs.map(x => x.file) });
    const acts = Array.isArray(res && res.activities) ? res.activities.map(cleanAct) : [];
    for (const a of acts) {
      const d = await getDay(a.date);
      a.dup = isDuplicate(a, d.acts);
      if (a.dup) a.on = false;
    }
    let steps = null;
    const ds = res && res.daily_steps;
    if (ds && n0(ds.steps) > 0) {
      const date = /^\d{4}-\d{2}-\d{2}$/.test(ds.date || '') && ds.date <= today() ? ds.date : S.date;
      steps = { on: true, date, count: Math.round(n0(ds.steps)), app: String((res && res.app) || '') };
    }
    if (!acts.length && !steps) throw { code: 'empty_completion' };
    acts.forEach(a => { a.app = String((res && res.app) || ''); });
    S.actDraft = acts; S.stepsDraft = steps;
  } catch (e) {
    S.shotErr = e && e.code === 'empty_completion' ? t('shot_none') : aiErr(e);
  } finally {
    S.shotBusy = null; renderLog();
  }
}

async function addFoods(items, date, meal) {
  const day = await getDay(date);
  const m = MEALS.includes(meal) ? meal : inferMeal(Date.now());
  const added = items.map(f => ({ id: uid(), meal: m, name: f.name, portion: f.portion || '', grams: f.grams || null, kcal: Math.round(n0(f.kcal)), lo: Math.round(n0(f.lo)), hi: Math.round(n0(f.hi)), p: n0(f.p), c: n0(f.c), f: n0(f.f), sg: n0(f.sg), fb: n0(f.fb), na: n0(f.na), t: Date.now() }));
  day.foods = day.foods.concat(added);
  await saveDay(day);
  remember(added);
  return added.map(a => a.id);
}

  const day = await getDay(date);

  await saveDay(day);
}
async function addActs(acts) {
  const byDate = {};
  acts.forEach(a => { (byDate[a.date] = byDate[a.date] || []).push(a); });
  for (const date of Object.keys(byDate)) {
    const day = await getDay(date);
    day.acts = day.acts.concat(byDate[date].map(a => ({
      id: uid(), type: a.type, title: a.title, start: a.start || null, dur: a.dur, dist: a.dist, elev: a.elev, hr: a.hr,
      kcal: a.kcal, steps: a.steps, inSteps: a.inSteps !== false, app: a.app || '', t: Date.now(),
    })));
    await saveDay(day);

}

function dayFrac(date) {

}

      <div class="vpick" role="group" aria-label="${t('a_vehicle')}">${Object.keys(VEHICLES).map(k => `<button data-act="vehicle" data-v="${k}" aria-pressed="${k === key}">${t('veh_' + k)}</button>`).join('')}</div>
      <div class="flightmsg">${flightMsg(r, F, key, isToday)}</div>
    </div>`;
}
function flightMsg(r, F, key, isToday) {
  const goal = n0(r.goal);
  const g = k => fi(Math.round(Math.abs(k) / 7.7));
  const noun = t('noun_' + key);
  const st = k => `<b class="st">${t(k)}</b> `;
  const B = v => `<b class="n">${v}</b>`;
  if (!isToday) {
    if (!r.logged) return st('st_nodata') + t('fm_nodata');
    if (F.state === 'over') return st('st_over') + t('fm_past_over', { in: fi(r.intake), out: fi(r.out), x: B(fi(r.intake - r.out)), g: g(r.intake - r.out) });
    const used = r.out - r.intake;
    return st(F.state === 'cruise' ? 'st_cruise' : 'st_heavy') + t(F.state === 'heavy' ? 'fm_past_used_under' : 'fm_past_used', { x: B(fi(used)), g: g(used), goal: fi(goal) });
  }
  if (F.state === 'cruise') {
    const head = r.intake > 0
      ? t('fm_cruise_left', { x: B(fi(r.left)) })
      : t('fm_cruise_empty', { now: hhmm(Date.now()), x: fi(r.sofar) });
    return st('st_cruise') + head + (goal > 0 ? ' ' + t('fm_cruise_plan', { target: fi(r.target), x: B(fi(goal)), g: g(goal) }) : '');
  }
  if (F.state === 'heavy') return st('st_heavy') + t('fm_heavy', { x: B(fi(r.intake - r.target)), noun, left: fi(r.out - r.intake), goal: fi(goal) });
  return st('st_over') + t('fm_over', { in: fi(r.intake), out: fi(r.out), x: B(fi(r.intake - r.out)), g: g(r.intake - r.out), Noun: noun.charAt(0).toUpperCase() + noun.slice(1) });
}

function macroBars(r, p) {
  const mt = macroTargets(p, r.target, r.w);
  const row = (lbl, cls, v, tg) => `<div class="mbar"><span>${lbl}</span><div class="mtrack"><i class="${cls}${v > tg ? ' over' : ''}" style="width:${Math.min(100, tg ? v / tg * 100 : 0).toFixed(1)}%"></i></div><b class="n">${fi(v)} / ${fi(tg)} g</b></div>`;
  return `<div class="mbars">${row(t('carb'), 'mc', r.carb, mt.c)}${row(t('protein'), 'mp', r.protein, mt.p)}${row(t('fat'), 'mf', r.fat, mt.f)}</div>`;
}
function actWhy(a) {
  const T = TYPES[a.type] || TYPES.other;
  if (a.method === 'jarak') return `${fdec(a.type === 'walk' && n0(a.elev) > 0 ? 0.5 : T.perKm)} ${K()}/kg/km${n0(a.elev) > 0 ? ' + ' + t('w_uphill') : ''}`;
  if (a.method === 'perangkat') return `${fi(a.kcal)} ${K()} × ${fdec(S.profile.corr == null ? DEFAULTS.corr : S.profile.corr)} − ${t('w_rest')}`;
  if (a.method === 'detak jantung') return `Keytel, HR ${fi(a.hr)}`;
  if (a.method === 'MET') return `MET ${fdec(T.met)} × ${fi(a.dur)} ${t('u_min')}`;
  return t('w_need_dur');
}

/* ---------- data bulanan & tab Model */
async function loadMonth(ym) {
  if (S.months.has(ym)) return S.months.get(ym);
  const n = daysInMonth(ym);
  const days = await getRange(ym + '-01', ym + '-' + pad(n));
  days.sort((a, b) => a.date < b.date ? -1 : 1);
  S.months.set(ym, days);
  return days;
}
function niceStep(range) { const rawS = range / 4; const m = Math.pow(10, Math.floor(Math.log10(rawS || 1))); return [1, 2, 2.5, 5, 10].map(k => k * m).find(s => s >= rawS) || m * 10; }

function balanceChart(ym, rows, goal) {
  const N = daysInMonth(ym), W = 340, H = 170, L = 38, R = 8, T = 10, B = 22;
  const vals = rows.filter(x => x.r.logged).map(x => x.r.balance);
  let lo = Math.min(-goal - 150, ...vals, 0), hi = Math.max(150, ...vals, 0);
  const st = niceStep(hi - lo); lo = Math.floor(lo / st) * st; hi = Math.ceil(hi / st) * st;
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const bw = (W - L - R) / N;
  const x = d => L + (d - 1) * bw;
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += st) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${fi(v)}</text>`;
  [1, 8, 15, 22, 29].filter(d => d <= N).forEach(d => { g += `<text x="${x(d) + bw / 2}" y="${H - 6}" text-anchor="middle">${d}</text>`; });
  const bars = rows.filter(x => x.r.logged).map(xr => {
    const d = Number(xr.date.slice(8)); const v = xr.r.balance;
    const y0 = y(0), y1 = y(v);
    return `<rect class="${v <= 0 ? 'b-neg' : 'b-pos'}" x="${(x(d) + bw * 0.15).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" y="${Math.min(y0, y1).toFixed(1)}" height="${Math.max(1, Math.abs(y1 - y0)).toFixed(1)}"><title>${shortDate(xr.date)}: ${signed(v)} ${K()}</title></rect>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('a_balance_chart')}">${g}
    <line class="ax" x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}"/>
    ${goal > 0 ? `<line class="tgt" x1="${L}" x2="${W - R}" y1="${y(-goal)}" y2="${y(-goal)}"/><text x="${W - R}" y="${y(-goal) - 4}" text-anchor="end" style="fill:var(--ink)">${t('target_minus', { x: fi(goal) })}</text>` : ''}
    ${bars}</svg>`;
}
function weightChart(ym, m) {
  const pts = m.weights; if (pts.length < 2) return '';
  const N = daysInMonth(ym), W = 340, H = 150, L = 38, R = 8, T = 10, B = 22;
  let lo = Math.min(...pts.map(p => p.y)), hi = Math.max(...pts.map(p => p.y));
  lo = Math.floor((lo - 0.3) * 2) / 2; hi = Math.ceil((hi + 0.3) * 2) / 2;
  const st = niceStep(hi - lo);
  const firstDate = ((S.months.get(ym) || [])[0] || { date: ym + '-01' }).date;
  const offset = Number(firstDate.slice(8)) - 1;
  const xd = d => L + (d - 0.5) / N * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += st) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${f1(v)}</text>`;
  [1, 8, 15, 22, 29].filter(d => d <= N).forEach(d => { g += `<text x="${xd(d)}" y="${H - 6}" text-anchor="middle">${d}</text>`; });
  const dayOf = p => p.x + 1 + offset;
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${xd(dayOf(p)).toFixed(1)},${y(p.y).toFixed(1)}`).join('');
  const dots = pts.map(p => `<circle class="wpt" cx="${xd(dayOf(p)).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="3"><title>${f1(p.y)} kg</title></circle>`).join('');
  let tr = '';
  if (m.trend) {
    const x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
    tr = `<path class="trend" d="M${xd(x0 + 1 + offset).toFixed(1)},${y(m.trend.intercept + m.trend.slope * x0).toFixed(1)}L${xd(x1 + 1 + offset).toFixed(1)},${y(m.trend.intercept + m.trend.slope * x1).toFixed(1)}"/>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('a_weight_chart')}">${g}<path class="wline" d="${line}"/>${tr}${dots}</svg>`;
}

async function renderModel(root) {
  if (S.mode === 'loading') return;
  const ym = S.month;
  const nav = `<div class="monthnav"><button class="iconbtn" data-act="month" data-d="-1" aria-label="${t('a_prev_month')}">‹</button><h2>${esc(monthName(ym))}</h2><button class="iconbtn" data-act="month" data-d="1" aria-label="${t('a_next_month')}" ${ym >= ymOf(today()) ? 'disabled' : ''}>›</button></div>`;
  if (!S.months.has(ym)) root.innerHTML = nav + `<div class="loading"><span class="busy"></span> ${t('loading_month')}</div>`;
  const days = await loadMonth(ym);
  if (S.view !== 'stats' || S.statsTab !== 'model' || S.month !== ym) return;
  const p = S.profile;
  const m = calcMonth(days.length ? days : [blankDay(ym + '-01')], p);
  const N = daysInMonth(ym);
  const tdy = today();
  const fatKg = m.predictedKg;
  const slopeW = m.trend ? `${m.trend.slope <= 0 ? '−' : '+'}${f1(Math.abs(m.trend.slope * 7))}` : '';
  const calib = m.calib
    ? `<div class="cmp">
         <div class="tile"><span class="k">${t('by_model')}</span><span class="v">${fi(m.calib.modelOut)}</span><span class="s">${t('kcal_out_day')}</span></div>
         <div class="tile"><span class="k">${t('by_scale')}</span><span class="v">${fi(m.calib.obsOut)}</span><span class="s">${t('kcal_out_day')}</span></div>
       </div>
       <p class="hint">${t('calib_text', {
         intake: fi(m.avgIntake), slope: slopeW, obs: `<b>${fi(m.calib.obsOut)}</b>`,
         cmp: Math.abs(m.calib.ratio - 1) < 0.05 ? t('calib_match') : `<b>${t(m.calib.ratio > 1 ? 'calib_higher' : 'calib_lower', { n: fi(Math.abs(m.calib.ratio - 1) * 100) })}</b>`,
       })}</p>`
    : `<p class="hint">${t('calib_need', { d: m.loggedDays, w: m.weights.length })}</p>`;

  root.innerHTML = nav + `
    <div class="tiles">
      <div class="tile"><span class="k">${t('avg_in')}</span><span class="v" style="color:var(--food)">${m.loggedDays ? fi(m.avgIntake) : '–'}</span><span class="s">${t('kcal_per_logged')}</span></div>
      <div class="tile"><span class="k">${t('avg_out')}</span><span class="v" style="color:var(--burn)">${m.loggedDays ? fi(m.avgOut) : '–'}</span><span class="s">${t('kcal_per_logged')}</span></div>
      <div class="tile"><span class="k">${t('total_balance')}</span><span class="v" style="color:${m.totalBalance <= 0 ? 'var(--ok)' : 'var(--bad)'}">${m.loggedDays ? signed(m.totalBalance) : '–'}</span><span class="s">${m.loggedDays ? t('approx_fat', { x: `${fatKg <= 0 ? '−' : '+'}${f1(Math.abs(fatKg))}` }) : K()}</span></div>
      <div class="tile"><span class="k">${t('days_logged')}</span><span class="v">${m.loggedDays}<span style="font-size:14px;color:var(--muted)"> / ${ym === ymOf(tdy) ? Number(tdy.slice(8)) : N}</span></span><span class="s">${t('days_with_food')}</span></div>
    </div>
    <div class="card">
      <div class="head"><h2>${t('daily_balance')}</h2><span class="tot">${K()}</span></div>
      ${m.loggedDays ? balanceChart(ym, m.rows, (rs => rs.length ? rs.reduce((s, x) => s + x.r.goal, 0) / rs.length : goalOf(p))(m.rows.filter(x => x.r.logged))) : `<p class="empty">${t('no_food_month')}</p>`}
    </div>
    <div class="card">
      <div class="head"><h2>${t('body_weight')}</h2><span class="tot">${m.trend ? `${slopeW} ${t('kg_per_week')}` : 'kg'}</span></div>
      ${m.weights.length >= 2 ? weightChart(ym, m) + `<p class="hint">${t('trend_hint')}</p>` : `<p class="empty">${t('weight_need2')}</p>`}
    </div>
    <div class="card calib">
      <div class="head"><h2>${t('model_vs_real')}</h2></div>
      ${calib}
    </div>
    ${S.downloads && m.loggedDays ? `<button class="btn" data-act="csv">${t('csv_btn')}</button>` : ''}`;
}

function mealIcon(k, cx, cy, P) {
  const st = c => `style="fill:${c}"`;

    let rays = '';
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; rays += `<line x1="${(cx + Math.cos(a) * 8).toFixed(1)}" y1="${(cy + Math.sin(a) * 8).toFixed(1)}" x2="${(cx + Math.cos(a) * 11).toFixed(1)}" y2="${(cy + Math.sin(a) * 11).toFixed(1)}" style="stroke:${P.carb};stroke-width:1.6;stroke-linecap:round"/>`; }
    return `${rays}<circle cx="${cx}" cy="${cy}" r="5.5" ${st(P.carb)}/>`;
  }
  if (k === 'siang') return `<circle cx="${cx + 3}" cy="${cy - 3}" r="5" ${st(P.carb)}/><path d="M${cx - 11} ${cy + 8} L${cx - 3} ${cy - 1} L${cx + 2} ${cy + 3} L${cx + 6} ${cy} L${cx + 11} ${cy + 8} Z" ${st(P.prot)}/>`;
  if (k === 'snack') return `<circle cx="${cx}" cy="${cy}" r="8" ${st(P.food)}/><circle cx="${cx - 3}" cy="${cy - 2}" r="1.3" ${st(P.onc)}/><circle cx="${cx + 3}" cy="${cy + 1}" r="1.3" ${st(P.onc)}/><circle cx="${cx - 1}" cy="${cy + 4}" r="1.3" ${st(P.onc)}/>`;
  return `<path d="M${cx + 3} ${cy - 9} A9 9 0 1 0 ${cx + 8} ${cy + 5} A7 7 0 1 1 ${cx + 3} ${cy - 9} Z" ${st(P.water)}/>`;
}
function summarySVG(date, day, r, P) {

  let s = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 440" width="340" height="440" class="sumsvg" role="img" aria-label="${esc(t('a_summary_of', { d: longDate(date) }))}">`;

  s += `<line x1="20" y1="50" x2="320" y2="50" style="stroke:${P.line}"/>`;
  s += T(20, 98, fi(r.intake), { s: 44, w: 700, f: P.num, c: P.food });
  s += T(20, 120, t('sum_kcal_in'), { s: 13, c: P.muted });
  s += T(320, 76, t('sum_target', { x: fi(r.target) }), { anchor: 'end', c: P.muted });
  if (r.logged) s += T(320, 96, t('sum_balance', { x: signed(r.balance) }), { anchor: 'end', w: 700, c: r.balance <= 0 ? P.ok : P.bad });
  if (n0(day.weight)) s += T(320, 116, t('sum_weight', { x: f1(day.weight) }), { anchor: 'end', c: P.muted });
  const macros = [[t('carb'), mp.c, r.carb, mt.c, P.carb], [t('protein'), mp.p, r.protein, mt.p, P.prot], [t('fat'), mp.f, r.fat, mt.f, P.fat]];
  macros.forEach(([lbl, pct, g, tg, col], i) => {
    const cx = 62 + i * 108;
    s += `<circle cx="${cx}" cy="170" r="28" style="fill:${col}"/>`;

  });
  MEALS.forEach((k, i) => {

function statBuckets(period) {

    for (let i = 6; i >= 0; i--) { const d = addDays(tdy, -i); out.push({ from: d, to: d, l1: i === 0 ? t('w_Today') : parseIso(d).toLocaleDateString(LOC(), { weekday: 'short' }), l2: dm(d), now: i === 0 }); }

  } else {

    for (let i = 5; i >= 0; i--) {
      const d = new Date(y, m - 1 - i, 1); const ym = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
      const last = `${ym}-${pad(daysInMonth(ym))}`;
      out.push({ from: ym + '-01', to: last > tdy ? tdy : last, l1: d.toLocaleDateString(LOC(), { month: 'short' }), l2: String(d.getFullYear()), now: i === 0 });
    }

}
function bucketVals(b, map, p) {
  const ds = []; let nDays = 0;
  for (let d = b.from; d <= b.to; d = addDays(d, 1)) { nDays++; const x = map.get(d); if (x) ds.push(x); }
  const rs = ds.map(d => ({ d, r: calcDay(d, p, 1) })).filter(x => x.r);
  const logged = rs.filter(x => x.r.logged), act = rs.filter(x => x.r.hasActivity);
  const wts = ds.filter(d => n0(d.weight) > 0).map(d => n0(d.weight));
  const fastH = sum(rs.map(x => x.r.fastH));
  return {
    in: logged.length ? sum(logged.map(x => x.r.intake)) / logged.length : null,
    burn: act.length ? sum(act.map(x => x.r.activeKcal)) / act.length : null,
    fast: fastH > 0 ? fastH / nDays : null,
    wt: wts.length ? sum(wts) / wts.length : null,
  };
}

/* ---------- AI dengan API key sendiri (versi offline / GitHub Pages)
   Halaman di luar Claude tidak mendapat kapabilitas `sample`. Pengguna boleh memasukkan kunci Claude API miliknya;
   aplikasi lalu memanggil API langsung dari browser (header resmi anthropic-dangerous-direct-browser-access: true,
   pola "bring your own key"). Kunci hanya disimpan di localStorage perangkat ini (nk:ai), tidak ikut cadangan,
   tidak pernah ditulis ke kode. Objek di bawah meniru antarmuka `sample` (fungsi + .json + .limits) sehingga
   kartu foto makanan, pembaca screenshot, dan rekap memakai jalur yang sama.
   Harga (platform.claude.com/docs/en/about-claude/pricing, dicek 23 Okt 2026), USD per juta token masuk / keluar. */
const AI_MODELS = {
  'claude-sonnet-5-5': { label: 'Sonnet 5.5', inp: 2, out: 10 },
  'claude-haiku-5-5': { label: 'Haiku 5.5', inp: 0.1, out: 0.5 },
};
const AI_DEFAULT_MODEL = 'claude-sonnet-5-5';
const AI_IMG_EDGE = 1568;           // sisi terpanjang setelah diperkecil (token gambar = ⌈w/28⌉·⌈h/28⌉)
const API_URL = 'https://api.anthropic.com/v1/messages';

function aiCfg() {
  const c = LS.get('ai');
  return c && typeof c.key === 'string' && c.key.trim() ? { key: c.key.trim(), model: AI_MODELS[c.model] ? c.model : AI_DEFAULT_MODEL } : null;
}
const apiErr = (code, message) => Object.assign(new Error(message || code), { code });

// Perkecil foto ke ≤ 1568 px dan kirim sebagai JPEG: request lebih kecil, lebih cepat, lebih murah.
async function imgBlock(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(apiErr('image_rejected')); i.src = url; });
    const s = Math.min(1, AI_IMG_EDGE / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.max(1, Math.round(img.naturalWidth * s)), h = Math.max(1, Math.round(img.naturalHeight * s));
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
    return { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: cv.toDataURL('image/jpeg', 0.85).split(',')[1] } };
  } finally { URL.revokeObjectURL(url); }
}
function parseJsonLoose(text) {
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/);
  const s = fence ? fence[1] : text;
  const i = s.search(/[[{]/); if (i < 0) return undefined;
  const j = s.lastIndexOf(s[i] === '{' ? '}' : ']');
  try { return JSON.parse(s.slice(i, j + 1)); } catch (e) { return undefined; }
}
function aiUsage() { return LS.get('aiUsage') || { calls: 0, cost: 0 }; }
function addUsage(model, u) {
  const M = AI_MODELS[model] || AI_MODELS[AI_DEFAULT_MODEL];
  const cost = (n0(u && u.input_tokens) * M.inp + n0(u && u.output_tokens) * M.out) / 1e6;
  const a = aiUsage(); LS.set('aiUsage', { calls: a.calls + 1, cost: a.cost + cost });
}

function makeApiSample(cfg) {
  const call = async (input, opts = {}) => {
    if (navigator.onLine === false) throw apiErr('offline');
    const content = [];
    const imgs = opts.images ? Array.from(opts.images) : [];
    for (let i = 0; i < imgs.length; i++) {
      if (imgs.length > 1) content.push({ type: 'text', text: `Gambar ${i + 1}:` });
      content.push(await imgBlock(imgs[i]));
    }
    content.push({ type: 'text', text: String(input) });
    let res;
    try {
      res = await fetch(API_URL, {
        method: 'POST', signal: opts.signal,
        headers: {
          'content-type': 'application/json', 'x-api-key': cfg.key, 'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({ model: cfg.model, max_tokens: opts.maxTokens || 2048, messages: [{ role: 'user', content }] }),
      });
    } catch (e) {
      if (e && e.name === 'AbortError') throw apiErr('cancelled');
      throw apiErr(navigator.onLine === false ? 'offline' : 'network', String((e && e.message) || e));
    }
    if (!res.ok) {
      let msg = ''; try { const j = await res.json(); msg = (j && j.error && j.error.message) || ''; } catch (e) { /* bukan JSON */ }
      const code = res.status === 401 || res.status === 403 ? 'bad_key'
        : res.status === 429 ? 'rate_limited'
        : res.status === 413 ? 'prompt_too_large'
        : res.status === 400 && /credit|balance|billing/i.test(msg) ? 'no_credit'
        : res.status === 400 ? 'invalid_request'
        : res.status === 529 ? 'overloaded' : 'upstream_error';
      throw apiErr(code, msg);
    }
    const j = await res.json();
    addUsage(cfg.model, j.usage);
    if (j.stop_reason === 'refusal') throw apiErr('refused');
    const text = (j.content || []).filter(b => b && b.type === 'text').map(b => b.text).join('');
    if (!text.trim()) throw apiErr('empty_completion');
    if (opts.onText) opts.onText({ text, delta: text });
    return { text, truncated: j.stop_reason === 'max_tokens' };
  };
  call.json = async (input, opts) => {
    const { text } = await call(input, opts);
    const v = parseJsonLoose(text);
    if (v === undefined) throw apiErr('invalid_json');
    return v;
  };
  call.limits = async () => ({ maxInputBytes: 200000, images: { maxCount: 4, maxInputBytes: 25e6, mediaTypes: ['image/*'] } });
  call.viaApi = true;
  call.model = cfg.model;
  return call;
}
async function useApiSample() {
  const cfg = aiCfg();
  if (!cfg) return false;
  S.sample = makeApiSample(cfg);
  S.img = (await S.sample.limits()).images;
  return true;
}

async function saveApiKey() {
  const raw = ($('#ai-key') || {}).value || '';
  const model = ($('#ai-model') || {}).value || AI_DEFAULT_MODEL;
  const prev = aiCfg();
  const key = raw.trim() || (prev && prev.key) || '';
  if (!key) { S.aiKeyMsg = { ok: false, text: t('apikey_empty') }; renderProf(); return; }
  S.aiKeyBusy = true; S.aiKeyMsg = null; renderProf();
  const cfg = { key, model: AI_MODELS[model] ? model : AI_DEFAULT_MODEL };
  try {
    await makeApiSample(cfg)('Balas hanya dengan kata: OK', { maxTokens: 5 });
    LS.set('ai', cfg); await useApiSample();
    S.aiKeyMsg = { ok: true, text: t('apikey_ok', { m: AI_MODELS[cfg.model].label }) };
  } catch (e) {
    S.aiKeyMsg = { ok: false, text: aiErr(e) || t('ai_failed') };
    if (e && e.code === 'bad_key' && prev && prev.key === key) { LS.set('ai', null); S.sample = null; S.img = null; }
  }
  S.aiKeyBusy = false; renderProf(); renderSync();
}

/* ---------- gambar */
function addImgs(kind, files) {
  const list = kind === 'food' ? S.foodImgs : S.shotImgs;
  const max = (S.img && S.img.maxCount) || 4;
  const maxBytes = (S.img && S.img.maxInputBytes) || 20e6;
  let skipped = 0;
  Array.from(files || []).forEach(f => {
    if (!/^image\//.test(f.type) || f.size > maxBytes || list.length >= max) { skipped++; return; }
    list.push({ file: f, url: URL.createObjectURL(f) });
  });
  if (skipped) toast(t('toast_skipped', { n: skipped, max }));
  if (kind === 'food') { S.foodText = ($('#food-text') || {}).value || S.foodText; }
  renderLog();
}
